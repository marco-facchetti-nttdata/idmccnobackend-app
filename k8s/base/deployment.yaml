apiVersion: apps/v1
kind: Deployment

metadata:
  name: idmccnobackend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: idmccnobackend

  template:
    metadata:
      labels:
        app: idmccnobackend

    spec:
      containers:

        - name: idmccnobackend

          image: idmccnobackend-app

          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: idmccnobackend-config

          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: idmccnobackend-secret
                  key: DB_PASSWORD

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"

            limits:
              cpu: "1000m"
              memory: "1Gi"