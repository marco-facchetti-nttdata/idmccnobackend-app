apiVersion: apps/v1
kind: Deployment

metadata:
  name: idmccnobackend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: idmccnobackend

  template:
    metadata:
      labels:
        app: idmccnobackend

    spec:
      containers:
        - name: idmccnobackend
          image: idmccnobackend-app

          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"
